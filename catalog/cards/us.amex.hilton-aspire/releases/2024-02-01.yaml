notes: 'Current terms recorded as the baseline. They come from the refresh announced October 2023: fee $450 to $550 (existing holders at renewals from February 1, 2024), resort credit $250 to $400 in two halves and new $200 flight credit (from January 1, 2024), Priority Pass and the $250 airline fee credit removed (February 1, 2024), CLEAR, National Executive, cell phone protection and $30,000/$60,000 spend nights added. Pre-refresh terms are not modeled. No 2025-2026 change was found apart from the CLEAR+ credit tracking the CLEAR+ price.'
