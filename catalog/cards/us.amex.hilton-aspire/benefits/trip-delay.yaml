id: us.amex.hilton-aspire/trip-delay
card_id: us.amex.hilton-aspire
kind: protection
name: Trip delay insurance
versions:
- version: 1
  change_type: added
  release: us.amex.hilton-aspire@2024-02-01
  summary: "Covers up to $500 per trip in expenses when a round trip paid with the card is delayed more than 6 hours, for at most 2 claims in any 12 months."
  face_value: null
  period:
    cadence: rolling
    window_days: 365
  coverage:
    per_trip:
      amount: 50000
      currency: USD
    waiting_hours: 6
    max_claims_per_period: 2
  conditions:
  - type: paid_with_card
    note: Round trip paid entirely with the card
  beneficiaries:
  - primary
  - authorized_user
  notes: 'Reimburses additional expenses charged to the card after a covered delay of more than 6 hours: up to $500 per trip, at most 2 claims per card per 12 consecutive months. Underwritten by New Hampshire Insurance Company (AIG).'
  grants:
  - entitlement: protection:trip_delay
