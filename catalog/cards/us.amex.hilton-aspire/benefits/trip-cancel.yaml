    note: Round trip paid entirely with the card
  beneficiaries:
  - primary
  - authorized_user
  notes: 'Non-refundable expenses charged to the card when a covered reason cancels or interrupts the trip: up to $10,000 per trip and $20,000 per card per 12 consecutive months.'
  grants:
  - entitlement: protection:trip_cancellation
