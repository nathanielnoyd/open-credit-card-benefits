kind: refresh
announced_on: '2026-08-03'
effective_for_new: '2026-08-23'
notes: 'August 2026 refresh: $695 fee, AA Vacations, inflight/Admirals Club, Omni and Avis benefits, larger Lyft credit and Loyalty Point bonuses, 12x on AAdvantage Hotels and Cars. Grubhub and the 25% inflight savings end for accounts opened on or after 2026-08-23. The card is now marketed as a World Legend Mastercard. Existing cardmembers open more than 12 months were notified by September 2026 and pay the new fee at their next anniversary; those open less than 12 months are notified in August 2027 and pay it at the anniversary after that, so the fee transition below is approximate.'
