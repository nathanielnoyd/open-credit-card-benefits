id: us.chase.ritz-carlton/return-protection
card_id: us.chase.ritz-carlton
kind: protection
name: Return protection
versions:
- version: 1
  change_type: added
  release: us.chase.ritz-carlton@2024-07-01
  summary: "Refunds items paid with the card that a store won't take back within 90 days, up to $500 per item and $1,000 a year."
  grants:
  - entitlement: protection:return
  coverage:
    per_item:
      amount: 50000
      currency: USD
    per_period:
      amount: 100000
      currency: USD
    window_days: 90
  conditions:
  - type: paid_with_card
  beneficiaries:
  - primary
  notes: Up to $500 per item and $1,000 per 12-month period, within 90 days of purchase.
