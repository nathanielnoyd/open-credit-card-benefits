id: us.chase.ritz-carlton/trip-cancel
card_id: us.chase.ritz-carlton
kind: protection
name: Trip cancellation and interruption
versions:
- version: 1
  change_type: added
  release: us.chase.ritz-carlton@2024-07-01
  summary: "Reimburses prepaid trip costs up to $10,000 per person and $20,000 per trip when a trip paid with the card is cancelled or cut short for a covered reason."
  grants:
  - entitlement: protection:trip_cancellation
  coverage:
    per_person:
      amount: 1000000
      currency: USD
    per_trip:
      amount: 2000000
      currency: USD
  conditions:
  - type: paid_with_card
  beneficiaries:
  - primary
  notes: Up to $10,000 per covered traveler and $20,000 per trip.
