id: us.chase.ritz-carlton/purchase-protection
card_id: us.chase.ritz-carlton
kind: protection
name: Purchase protection
versions:
- version: 1
  change_type: added
  release: us.chase.ritz-carlton@2024-07-01
  summary: "Covers items you buy with the card against damage or theft for 120 days, up to $10,000 per item and $50,000 a year."
  grants:
  - entitlement: protection:purchase
  coverage:
    per_item:
      amount: 1000000
      currency: USD
    per_period:
      amount: 5000000
      currency: USD
    window_days: 120
  conditions:
  - type: paid_with_card
  beneficiaries:
  - primary
  notes: 120 days from purchase; up to $10,000 per item and $50,000 a year. Chase's public page briefly showed $500 per item in error in 2026.
