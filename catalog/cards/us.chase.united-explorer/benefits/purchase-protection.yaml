id: us.chase.united-explorer/purchase-protection
card_id: us.chase.united-explorer
kind: protection
name: Purchase protection
versions:
- version: 1
  change_type: added
  release: us.chase.united-explorer@2024-01-01
  summary: "Covers new purchases paid with the card against damage or theft for 120 days, up to $10,000 per item."
  coverage:
    per_item:
      amount: 1000000
      currency: USD
    window_days: 120
  grants:
  - entitlement: protection:purchase
  conditions:
  - type: paid_with_card
  beneficiaries:
  - primary
  - authorized_user
  notes: Damage or theft within 120 days of purchase (90 days for New York residents).
