notes: The card was renamed from United Club Infinite to United Club Card. The fee rose from $525 to $695, applying to existing
  cardmembers from their first renewal on or after August 1, 2025. The standard membership dropped to one adult guest and children
  under 18 and lost Star Alliance lounges, which now come with All Access; the date the membership change reached existing
  cardmembers is not modeled. New credits took effect for new and existing cardmembers.
