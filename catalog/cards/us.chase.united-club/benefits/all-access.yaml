  grants:
  - entitlement: lounge_network:united_club
    value_share: '0.5'
    attributes:
      guests: 2
  - entitlement: lounge_network:star_alliance
    value_share: '0.5'
  conditions:
  - type: spend_gte
    amount: 5000000
    currency: USD
    period: calendar_year
    note: $50,000 in net purchases in a calendar year; Premier Gold or higher status also unlocks it
  beneficiaries:
  - primary
  - guest
  notes: Two adult guests, or one adult guest plus dependent children under 18, and Star Alliance member lounges. Unlocked by
    $50,000 in calendar-year purchases or by holding Premier Gold or higher; the status path cannot be expressed as a condition.
