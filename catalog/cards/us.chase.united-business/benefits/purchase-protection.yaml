id: us.chase.united-business/purchase-protection
card_id: us.chase.united-business
kind: protection
name: Purchase protection
versions:
- version: 1
  change_type: added
  release: us.chase.united-business@2024-01-01
  summary: "Covers new purchases paid with the card against damage or theft for 120 days, up to $10,000 per claim and $50,000 per account."
  coverage:
    per_claim:
      amount: 1000000
      currency: USD
    per_period:
      amount: 5000000
      currency: USD
    window_days: 120
  grants:
  - entitlement: protection:purchase
  conditions:
  - type: paid_with_card
  beneficiaries:
  - primary
  - authorized_user
  notes: Damage or theft within 120 days of purchase; up to $10,000 per claim and $50,000 per account. The $50,000 is an account limit with no stated period; per_period approximates it.
  sources:
  - url: https://upgradedpoints.com/credit-cards/reviews/the-chase-united-business-card-review/
    retrieved_at: '2026-11-13'
    publisher: review
