id: us.chase.ihg-business@2026-10-01
card_id: us.chase.ihg-business
kind: refresh
first_seen_on: '2026-10-01'
notes: 'Card renamed IHG One Rewards Business; new terms for new applicants on October 1, 2026. Existing cardmembers: new
  credits and earn categories at once (5x travel and office supply earn ends December 31, 2026 for everyone); Elite Night
  Credits from January 1, 2027; $200 fee and 50,000-point free nights from the first renewal in 2027 (October-December 2026
  renewals keep $99 and a 40,000-point night); United TravelBank ends after December 31, 2026. The date the old $20,000
  milestone stopped for existing cardmembers, and when the $25,000 milestone starts for them, are not confirmed.'
effective_for_new: '2026-10-01'
