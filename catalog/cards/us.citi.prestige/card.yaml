notes: >-
  Citi stopped taking applications on July 1, 2021 and product changes into the card on June 19, 2021; existing accounts remain
  open with the terms modeled here. A premium ThankYou card: points in a Prestige account transfer to partners at full ratios,
  like the Strata Premier and Strata Elite. Its premium-tier successor is the Strata Elite (launched July 27, 2025), but Prestige
  accounts were not converted. Reviews say the card carries no trip, baggage, rental car or shopping protections apart from cell
  phone protection. No foreign transaction fees.
