id: us.amex.delta-reserve-business/trip-delay
card_id: us.amex.delta-reserve-business
kind: protection
name: Trip delay insurance
versions:
- version: 1
  change_type: added
  release: us.amex.delta-reserve-business@2025-02-01
  summary: Covers up to $500 per trip in expenses when a trip paid with the card is delayed more than 6 hours, for at most
    2 claims in any 12 months.
  coverage:
    per_trip:
      amount: 50000
      currency: USD
    waiting_hours: 6
    max_claims_per_period: 2
  period:
    cadence: rolling
    window_days: 365
  grants:
  - entitlement: protection:trip_delay
  conditions:
  - type: paid_with_card
  beneficiaries:
  - primary
  - authorized_user
