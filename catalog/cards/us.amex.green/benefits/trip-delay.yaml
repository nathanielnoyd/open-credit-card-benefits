id: us.amex.green/trip-delay
card_id: us.amex.green
kind: protection
name: Trip delay reimbursement
versions:
- version: 1
  change_type: added
  release: us.amex.green@2026-01-01
  summary: "Covers up to $300 per trip in expenses when a round trip paid with the card is delayed more than 12 hours, for at most 2 claims in any 12 months."
  coverage:
    per_trip:
      amount: 30000
      currency: USD
    waiting_hours: 12
    max_claims_per_period: 2
  grants:
  - entitlement: protection:trip_delay
  conditions:
  - type: paid_with_card
  notes: Round trip paid entirely with the card; delays over 12 hours; up to $300 per trip; at most 2 claims per 12 consecutive months.
  beneficiaries:
  - primary
