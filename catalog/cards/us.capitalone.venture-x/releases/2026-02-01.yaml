notes: >-
  Lounge changes announced by email to cardholders in early June 2025 (exact date not confirmed) and effective February 1, 2026
  for everyone: no free Priority Pass guests, Capital One Lounge guests only after $75,000 of calendar-year spend, and authorized
  users lose lounge access unless the primary pays $125 a year for each. Authorized user cards themselves stay free. Capital One
  Landings (LGA, DCA) are included from this release.
