notes: Issued by Goldman Sachs Bank USA on Mastercard. On January 7, 2026, JPMorgan Chase announced it will become the issuer in about 24 months, subject to regulatory approval; Mastercard stays the network and the announcement promises no change to Daily Cash. No effective date or term changes are known, so the issuer move is not modeled as a release. No annual, foreign transaction, late or over-the-limit fees. Apple Card Family lets co-owners and participants share an account at no cost. Apple Card Monthly Installments offer 0% APR on eligible Apple purchases. Daily Cash pays out daily to Apple Cash or Apple Savings.
