card_id: us.usbank.altitude-reserve
kind: change
announced_on: "2025-08-01"
effective_for_new: "2025-12-15"
notes: >-
  Announced to cardholders in early August 2025 (Doctor of Credit confirmed it on August 1, 2025, after an image
  leaked on July 28) and effective December 15, 2025 for all cardholders, since the card was already closed to
  applicants. The $325 credit became Travel Center only, mobile wallet 3x was capped at $5,000 per billing cycle,
  Travel Center hotels and cars rose to 10x and Travel Center flights got 5x. Points for travel fell from 1.5 to 1
  cent the same day; that change is recorded on the pts:usbank_altitude currency. Transfer partners promised in this
  announcement launched August 11, 2026 and are also recorded on the currency.
