notes: >-
  Terms as observed when the card closed to new applicants on November 11, 2024; this is the last date any new
  applicant could get them. Earlier history (the card launched in 2017; the authorized user fee was dropped and the
  $325 credit extended to dining in 2021) is not modeled. Points were then worth 1.5 cents for travel through
  Real-Time Rewards and the Travel Center (see pts:usbank_altitude).
