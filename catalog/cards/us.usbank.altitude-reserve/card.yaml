notes: >-
  U.S. Bank stopped taking applications on November 11, 2024; existing cardholders keep and renew the card, and some
  holders of other Altitude cards report product changing into it. Authorized user cards have been free since early
  2021. Points transfer to airline and hotel programs from August 11, 2026 (see the pts:usbank_altitude currency).
  The issuer's product page no longer exists, so terms come from review sites.
