rules:
- id: us.amex.blue-cash-everyday/us-supermarkets-3
  categories:
  - cat:groceries.store
  versions:
  - version: 1
    release: us.amex.blue-cash-everyday@2025-08-01
    multiplier: "3"
    cap:
      amount: 600000
      currency: USD
    cap_period: calendar_year
    conditions:
    - type: region
      countries:
      - US
    notes: US supermarkets, up to $6,000 a year, then 1%; excludes superstores, warehouse clubs and specialty stores.
