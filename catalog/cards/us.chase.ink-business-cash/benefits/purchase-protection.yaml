id: us.chase.ink-business-cash/purchase-protection
card_id: us.chase.ink-business-cash
kind: protection
name: Purchase protection
versions:
- version: 1
  change_type: added
  release: us.chase.ink-business-cash@2025-01-01
  summary: "Covers items you buy with the card against damage or theft for 120 days, up to $10,000 per claim and $50,000 per account."
  face_value: null
  coverage:
    per_claim:
      amount: 1000000
      currency: USD
    per_period:
      amount: 5000000
      currency: USD
    window_days: 120
  grants:
  - entitlement: protection:purchase
  conditions:
  - type: paid_with_card
  beneficiaries:
  - primary
  - authorized_user
  notes: Damage or theft within 120 days of purchase; up to $10,000 per claim and $50,000 per account. The $50,000 is an account limit with no stated period; per_period approximates it.
