notes: >-
  Earns ThankYou points: 1 when you buy and 1 when you pay. 3% foreign transaction fee. On its own the card reaches only a few
  transfer partners at reduced ratios (generally 1,000 to 700 or 1,000 to 800); points moved to a Strata Premier, Strata Elite
  or legacy Prestige/Premier account transfer at full ratios, including to American AAdvantage (partner since July 27, 2025).
