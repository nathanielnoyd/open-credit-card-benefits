  versions:
  - version: 1
    release: us.barclays.wyndham-earner-premier@2026-06-17
    multiplier: '8'
    notes: Eligible folio charges at participating Hotels by Wyndham (including Wyndham Travel Bundles), Caesars Rewards and
      Trademark Collection lodging and Trademark Collection vacation club resorts. Echo Suites, WaterWalk unfurnished suites
      and non-participating hotels are excluded.
