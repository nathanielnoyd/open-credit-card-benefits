  - cat:gas_ev.ev_charging
  - cat:travel.parking_tolls
  - cat:travel.transit
  versions:
  - version: 1
    release: us.barclays.wyndham-earner-premier@2026-06-17
    multiplier: '4'
    notes: 'Issuer travel definition: airfare, car rental, rideshare, gas, EV charging, tolls and trains, by merchant code.
      Parking shares the tolls category here but may not qualify; Vacation Club resorts outside the Trademark Collection,
      their maintenance fees and timeshare loan payments to Wyndham developers also earn 4x but have no spend category.'
