kind: baseline
effective_for_new: "2020-01-01"
notes: >-
  Current terms recorded as the baseline from January 1, 2020, when City National restructured the card: the airline
  credit went from $250 per card to $350 per account, authorized user cards began costing $95, Priority Pass guests
  became paid, gas and groceries left the 3x categories and the Visa Infinite discount air benefit ended. Terms
  before 2020 are not modeled, and terms are as observed on the issuer page on November 14, 2026; the Global Entry
  credit was $100 in older reviews and its increase to $120 is not dated.
