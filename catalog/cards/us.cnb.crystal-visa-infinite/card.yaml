notes: >-
  Authorized (additional) cards cost $95 each a year since 2020. Older reviews mention 12 Gogo in-flight internet
  passes a year per card, but the issuer page no longer lists them and no current source confirms them, so they are not
  modeled. Other issuer-listed perks not modeled: Crystal Card Concierge, Troon Rewards and Troon Prive golf benefits,
  preferred seating at Beacon Theatre events, and car rental privileges with Avis, Hertz, National and Audi on demand.
