notes: >-
  Closed to new applications on May 28, 2026; existing cardmembers keep their terms, and some report product changes into it
  are still possible. Earns ThankYou points as cash back. 3% foreign transaction fee. On its own it reaches only a few transfer
  partners at reduced ratios; points moved to a Strata Premier, Strata Elite or legacy Prestige/Premier account transfer at
  full ratios, including to American AAdvantage (partner since July 27, 2025).
