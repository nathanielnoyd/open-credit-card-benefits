  (reduced travel earn ends Dec 31, 2026 for everyone); Elite Night Credits from January 1, 2027; $150 fee and 50,000-point
  free night at the first renewal in 2027 (Oct-Dec 2026 renewals keep $99 and a 40,000-point night); automatic Platinum kept
  through December 31, 2027.'
