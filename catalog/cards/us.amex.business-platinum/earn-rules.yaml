card_id: us.amex.business-platinum
rules:
  - id: us.amex.business-platinum/amex-travel-5x
    name: Amex Travel flights and prepaid hotels
    categories:
      - cat:travel.portal.amex.flights
      - cat:travel.portal.amex.hotels_prepaid
    versions:
      - version: 1
        release: us.amex.business-platinum@2025-07-01
        multiplier: "5"
        notes: Flights and prepaid hotels (including Fine Hotels + Resorts) booked on AmexTravel.com or the Amex Travel app.
