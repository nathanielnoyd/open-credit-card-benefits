id: us.amex.blue-cash-preferred/return-protection
card_id: us.amex.blue-cash-preferred
kind: protection
name: Return protection
versions:
- version: 1
  change_type: added
  release: us.amex.blue-cash-preferred@2025-01-30
  summary: "Refunds up to $300 per item and $1,000 per calendar year when a seller won't take back an item within 90 days of purchase; the purchase must be paid with the card."
  coverage:
    per_item:
      amount: 30000
      currency: USD
    per_period:
      amount: 100000
      currency: USD
    window_days: 90
  grants:
  - entitlement: protection:return
  conditions:
  - type: paid_with_card
  notes: Refund when the seller won't take an item back within 90 days; up to $300 per item and $1,000 per calendar year; US purchases paid
    entirely with the card; excludes shipping and handling.
  beneficiaries:
  - primary
