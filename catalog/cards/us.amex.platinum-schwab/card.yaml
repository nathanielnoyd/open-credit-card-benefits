id: us.amex.platinum-schwab
name: The Platinum Card from American Express Exclusively for Charles Schwab
summary: "The $895-a-year Amex Platinum Card for Charles Schwab clients, with every consumer Platinum benefit; its Schwab-linked extras, a points cash-out to Schwab and an asset-tiered annual credit, are described in its notes."
based_on:
  card: us.amex.platinum
open_to_applicants: true
url: https://www.americanexpress.com/us/credit-cards/card/schwab-platinum/
aliases: [Schwab Platinum, Amex Platinum for Schwab, Amex Schwab Platinum]
related:
  - { card_id: us.amex.platinum, relation: variant }
notes: >-
  Requires an eligible Charles Schwab brokerage account. Two terms depend on that relationship and can't be expressed
  yet (roadmap: outside relationships). Invest with Rewards: Membership Rewards points can be deposited into an eligible
  Schwab brokerage account at 1.1 cents each, on up to 1,000,000 points a calendar year (one review says 0.8 cents
  beyond that). Schwab Appreciation Bonus: an annual statement credit of 100 dollars with qualifying Schwab holdings of
  250,000 dollars or more, 200 dollars with 1 million or more, and, per two reviews, 1,000 dollars with 10 million or more
  (or Schwab Private Wealth Services clients); holdings are measured annually after account approval. Additional
  Platinum cards cost the same as on the consumer Platinum (195 dollars each, none free).
