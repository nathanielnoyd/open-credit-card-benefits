notes: The fee rose to $695, applying to existing cardmembers from their first renewal on or after August 1, 2025. The standard
  membership dropped to one adult guest and children under 18 and lost Star Alliance lounges, which now come with All Access;
  Dan's Deals reports the membership change reached existing cardmembers at their next renewal on or after August 1, which is
  not modeled. The spend PQP cap rose from 15,000 to 28,000. New credits took effect for new and existing cardmembers.
