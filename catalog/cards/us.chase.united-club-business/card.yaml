summary: "A $695-a-year United business card with a United Club membership, earning 2x on United purchases, 5x on prepaid Renowned Hotels stays and 1.5x elsewhere, with two free checked bags, Premier Access, up to 28,000 PQP a year from spend and travel, rideshare and Instacart credits."
