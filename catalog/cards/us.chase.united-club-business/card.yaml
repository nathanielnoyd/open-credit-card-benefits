notes: Employee cards are free but get no United Club membership of their own. Chase advertises 8x total on United flights, of
  which 6x is the MileagePlus cardmember flight earn and only 2x is card earn. Chase's page still lists complimentary Premier
  upgrades on award tickets for Premier cardmembers, but reviews report the perk ended for United cards on August 1, 2025, so
  it is not modeled. A Global Entry, TSA PreCheck or NEXUS credit appears in some reviews, but Chase said it was listed for this
  card by mistake and its product pages do not include it, so it is not modeled. Some reviews list price protection; Chase's
  benefit page does not, so it is not modeled.
