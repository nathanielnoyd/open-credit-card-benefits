notes: Current terms recorded as the baseline, from the refresh announced March 28, 2024 (fee $95 to $195, quarterly Hilton credit, 5x/3x replacing the 6x categories, Free Night Rewards and Priority Pass removed, National Executive added). Existing holders got the new fee at renewals on or after July 1, 2024, and their free-night spend counted through June 30, 2024. Terms before the refresh are not modeled. No later change was found through November 2026.
