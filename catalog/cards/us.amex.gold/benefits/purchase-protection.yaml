id: us.amex.gold/purchase-protection
card_id: us.amex.gold
kind: protection
name: Purchase protection
versions:
- version: 1
  change_type: added
  release: us.amex.gold@2024-07-25
  summary: "Covers theft, accidental damage or loss within 90 days of purchase for items paid with the card, up to $10,000 per item and $50,000 per calendar year."
  coverage:
    per_item:
      amount: 1000000
      currency: USD
    per_period:
      amount: 5000000
      currency: USD
    window_days: 90
  grants:
  - entitlement: protection:purchase
  conditions:
  - type: paid_with_card
  notes: Theft, accidental damage or loss within 90 days of purchase; up to $10,000 per covered purchase and $50,000 per calendar year.
  beneficiaries:
  - primary
