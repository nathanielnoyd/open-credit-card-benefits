id: us.chase.freedom-unlimited/trip-cancel
card_id: us.chase.freedom-unlimited
kind: protection
name: Trip cancellation and interruption
versions:
- version: 1
  change_type: added
  release: us.chase.freedom-unlimited@2024-01-01
  summary: "Reimburses prepaid trip costs up to $1,500 per traveler and $6,000 per trip when a trip paid with the card is cancelled or cut short for a covered reason."
  coverage:
    per_person:
      amount: 150000
      currency: USD
    per_trip:
      amount: 600000
      currency: USD
  grants:
  - entitlement: protection:trip_cancellation
  conditions:
  - type: paid_with_card
  notes: Up to $1,500 per traveler and $6,000 per trip.
  beneficiaries:
  - primary
