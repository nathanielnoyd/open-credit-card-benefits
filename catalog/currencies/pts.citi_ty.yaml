id: pts:citi_ty
name: Citi ThankYou Points
kind: transferable
issuer: Citi
url: https://www.thankyou.com/
expiry: none
pooling:
  family: citi-thankyou
paths:
  - id: cash-premium
    kind: statement_credit
    rate: "0.75"
    effective_from: "2025-08-24"
    notes: Strata Premier and Prestige cash back fell from 1¢ to 0.75¢ on August 24, 2025. Points held on a Double Cash or other no-fee card still redeem at 1¢.
  - id: cash-premium-legacy
    kind: statement_credit
    rate: "1.0"
    effective_to: "2025-08-23"
  - id: cash-no-fee
    kind: statement_credit
    rate: "1.0"
    notes: Cash back, statement credit or deposit at 1¢ from a no-fee card such as Double Cash; ThankYou points can be moved between one's own accounts.
    requires:
      - type: wallet_holds
        card_id: us.citi.double-cash
  - id: citi-travel
    kind: portal
    rate: "1.0"
    notes: Citi Travel bookings at 1¢ for every ThankYou card.
  - id: flying-blue
    kind: transfer
    to: pts:flying_blue
    ratio: "1:1"
    requires:
      - type: any_of
        note: Full ratios need a Citi Strata Premier, Strata Elite or Prestige (closed to applicants) in the ThankYou account.
        conditions:
          - { type: wallet_holds, card_id: us.citi.strata-premier }
          - { type: wallet_holds, card_id: us.citi.strata-elite }
          - { type: wallet_holds, card_id: us.citi.prestige }
