id: pts:usbank_altitude
name: U.S. Bank Altitude Points
kind: fixed_value
issuer: U.S. Bank
url: https://www.usbank.com/credit-cards/altitude-reserve-visa-infinite-credit-card.html
cents_per_point: "1.0"
