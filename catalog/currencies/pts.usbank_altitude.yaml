    kind: transfer
    to: pts:flying_blue
    ratio: "1:1"
    effective_from: "2026-08-11"
    notes: Altitude Reserve only. Transfers launched August 11, 2026; Flying Blue was briefly removed on August 12 and restored August 17.
    requires:
      - { type: wallet_holds, card_id: us.usbank.altitude-reserve }
  - id: avianca
    kind: transfer
    to: pts:avianca_lifemiles
    ratio: "1:1"
    effective_from: "2026-08-30"
    notes: Altitude Reserve only. Added August 30, 2026.
    requires:
      - { type: wallet_holds, card_id: us.usbank.altitude-reserve }
  - id: qantas
    kind: transfer
    to: pts:qantas
    ratio: "1:1"
    effective_from: "2026-08-11"
    notes: Altitude Reserve only. Removed August 12 and restored August 27, 2026 per Doctor of Credit; one later report says transfers were still suspended.
    requires:
      - { type: wallet_holds, card_id: us.usbank.altitude-reserve }
  - id: ethiopian
    kind: transfer
    to: pts:ethiopian_shebamiles
    ratio: "1:1"
    effective_from: "2026-08-11"
