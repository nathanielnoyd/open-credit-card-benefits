    requires:
      - { type: wallet_holds, card_id: us.usbank.altitude-reserve }
  - id: accor
    kind: transfer
    to: pts:accor_all
    ratio: "2:1"
    effective_from: "2026-08-11"
    notes: Altitude Reserve only.
    requires:
      - { type: wallet_holds, card_id: us.usbank.altitude-reserve }
