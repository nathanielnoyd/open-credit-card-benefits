  - id: travel-center
    kind: portal
    rate: "1.0"
    effective_from: "2025-12-15"
  - id: real-time-rewards-reserve
    kind: statement_credit
    rate: "1.5"
    effective_to: "2025-12-14"
    notes: Altitude Reserve Real-Time Rewards and travel-center bookings were 1.5¢ until U.S. Bank cut them to 1¢ on December 15, 2025.
    requires:
      - { type: wallet_holds, card_id: us.usbank.altitude-reserve }
  - id: real-time-rewards
    kind: statement_credit
    rate: "1.0"
    effective_from: "2025-12-15"
    notes: Real-Time Rewards against travel purchases.
