id: pts:capital_one_miles
name: Capital One Miles
kind: transferable
issuer: Capital One
url: https://www.capitalone.com/credit-cards/venture/
expiry: none
pooling:
  family: capital-one-miles
  notes: Minimum transfer to partners is 1,000 miles. Miles can be moved to any other Capital One miles account, including another person's; cash-back cards can move rewards into a miles account.
paths:
  - id: cover-travel-purchases
    kind: statement_credit
    rate: "1.0"
    notes: Purchase Eraser, against travel purchases charged in the last 90 days.
  - id: capital-one-travel
    kind: portal
    rate: "1.0"
  - id: cash
    kind: statement_credit
    rate: "0.5"
    notes: Cash back, check or non-travel statement credit.
  - id: gift-cards
    kind: gift_card
    rate_min: "0.8"
    rate_max: "1.0"
    rate_expected: "1.0"
  - id: pay-with-points-checkout
    kind: pay_with_points
    rate: "0.8"
    notes: Amazon and PayPal checkout; sources range from 0.8¢ to 1¢.
  - id: aeromexico
    kind: transfer
    to: pts:aeromexico_rewards
    ratio: "1:1"
  - id: aeroplan
    kind: transfer
