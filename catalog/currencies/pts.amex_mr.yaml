    ratio: "1:1"
  - id: virgin-atlantic
    kind: transfer
    to: pts:virgin_atlantic
    ratio: "1:1"
  - id: choice
    kind: transfer
    to: pts:choice_privileges
    ratio: "1:1"
  - id: hilton
    kind: transfer
    to: pts:hilton_honors
    ratio: "1:2"
  - id: marriott
    kind: transfer
    to: pts:marriott_bonvoy
    ratio: "1:1"
  - id: leaders-club
    kind: transfer
