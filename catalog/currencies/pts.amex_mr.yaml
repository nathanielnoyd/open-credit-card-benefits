id: pts:amex_mr
kind: transferable
name: American Express Membership Rewards
issuer: American Express
url: https://global.americanexpress.com/rewards
paths:
  - id: statement
    kind: statement_credit
    notes: Typically under 1¢ a point.
    rate_max: "1.0"
    rate_expected: "0.6"
  - id: amex-travel-flights
    kind: portal
    rate: "1.0"
    notes: Flights booked through Amex Travel. Card-level rebates (e.g. Business Platinum's 35% back) are benefits, not modeled here.
  - id: amex-travel-other
    kind: portal
    rate: "0.7"
    notes: Hotels, prepaid stays, cars and cruises through Amex Travel are usually about 0.7¢ (some 0.5¢).
    rate_min: "0.5"
  - id: pay-with-points-checkout
    kind: pay_with_points
    rate: "0.7"
    notes: Pay with Points at checkout (Amazon and similar merchants).
  - id: gift-cards
    kind: gift_card
    rate_min: "0.5"
    rate_max: "1.0"
    rate_expected: "1.0"
    notes: Varies by merchant.
  - id: flying-blue
    kind: transfer
    to: pts:flying_blue
    ratio: "1:1"
  - id: delta
    kind: transfer
    to: pts:delta_skymiles
    ratio: "1:1"
    notes: Amex charges an excise-tax offset of 0.06¢ per point (up to $99) on transfers to US airlines; not modeled.
  - id: aer-lingus
    kind: transfer
    to: pts:aer_lingus_avios
    ratio: "1:1"
  - id: aeromexico
    kind: transfer
    to: pts:aeromexico_rewards
    ratio: "1:1.6"
  - id: aeroplan
    kind: transfer
    to: pts:aeroplan
    ratio: "1:1"
  - id: ana
    kind: transfer
    to: pts:ana_mileage_club
    ratio: "1:1"
    transfer_days: 2
  - id: avianca
    kind: transfer
    to: pts:avianca_lifemiles
    ratio: "1:1"
  - id: british-airways
    kind: transfer
    to: pts:ba_avios
    ratio: "1:1"
  - id: cathay
    kind: transfer
    to: pts:cathay_asia_miles
    ratio: "5:4"
  - id: emirates
    kind: transfer
    to: pts:emirates_skywards
    ratio: "5:4"
    effective_from: "2025-09-16"
    notes: Reduced from 1:1 on September 16, 2025.
  - id: etihad
    kind: transfer
    to: pts:etihad_guest
    ratio: "1:1"
    effective_to: "2026-06-29"
    notes: Amex ended Etihad Guest transfers globally; the last US transfer day was June 29–30, 2026.
  - id: iberia
    kind: transfer
