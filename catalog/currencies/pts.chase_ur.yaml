    requires: *transfer-cards
  - id: iberia
    kind: transfer
    to: pts:iberia_avios
    ratio: "1:1"
    requires: *transfer-cards
  - id: jetblue
    kind: transfer
    to: pts:jetblue_trueblue
    ratio: "1:1"
    requires: *transfer-cards
  - id: singapore
    kind: transfer
    to: pts:singapore_krisflyer
    ratio: "1:1"
    requires: *transfer-cards
  - id: southwest
    kind: transfer
    to: pts:southwest_rr
    ratio: "1:1"
    requires: *transfer-cards
  - id: virgin-atlantic
    kind: transfer
    to: pts:virgin_atlantic
    ratio: "1:1"
    requires: *transfer-cards
  - id: ihg
    kind: transfer
    to: pts:ihg_one
    ratio: "1:1"
    requires: *transfer-cards
  - id: marriott
    kind: transfer
    to: pts:marriott_bonvoy
    ratio: "1:1"
    transfer_days: 2
    requires: *transfer-cards
  - id: wyndham
    kind: transfer
    to: pts:wyndham_rewards
    ratio: "1:1"
    notes: Added in early 2026.
    requires: *transfer-cards
